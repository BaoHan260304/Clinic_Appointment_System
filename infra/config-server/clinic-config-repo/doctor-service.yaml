server:
  port: 8082

spring:
  application:
    name: doctor-service

  datasource:
    url: ${DOCTOR_DB_URL:jdbc:postgresql://localhost:5432/doctor_db}
    username: ${DOCTOR_DB_USERNAME:postgres}
    password: ${DOCTOR_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123}}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always
