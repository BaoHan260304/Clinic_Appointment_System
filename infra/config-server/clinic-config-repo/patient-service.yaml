server:
  port: 8084

spring:
  application:
    name: patient-service

  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:55435/patient_db}
    username: ${PATIENT_DB_USERNAME:postgres}
    password: ${PATIENT_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123}}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always
